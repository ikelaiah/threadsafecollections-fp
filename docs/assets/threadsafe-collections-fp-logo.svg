<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">ThreadSafeCollections-FP</title>
  <desc id="description">Four parallel data lanes converge through a central lock beside the ThreadSafeCollections-FP wordmark.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#10294a"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="944" height="244" rx="30" fill="url(#background)"/>
  <rect x="8.5" y="8.5" width="943" height="243" rx="29.5" fill="none" stroke="#294568"/>
  <circle cx="148" cy="130" r="112" fill="url(#glow)"/>

  <g transform="translate(48 38)" filter="url(#shadow)">
    <rect width="184" height="184" rx="42" fill="#0b1e36" stroke="#315377" stroke-width="2"/>

    <g fill="none" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <path d="M28 41h20c19 0 19 27 36 38" stroke="#38bdf8"/>
      <path d="M28 71h25c14 0 18 9 31 15" stroke="#60a5fa"/>
      <path d="M28 113h25c14 0 18-9 31-15" stroke="#818cf8"/>
      <path d="M28 143h20c19 0 19-27 36-38" stroke="#a78bfa"/>

      <path d="M100 79c17-11 17-38 36-38h20" stroke="#38bdf8"/>
      <path d="M100 86c13-6 17-15 31-15h25" stroke="#60a5fa"/>
      <path d="M100 98c13 6 17 15 31 15h25" stroke="#818cf8"/>
      <path d="M100 105c17 11 17 38 36 38h20" stroke="#a78bfa"/>
    </g>

    <g>
      <rect x="17" y="34" width="22" height="14" rx="4" fill="#38bdf8"/>
      <rect x="17" y="64" width="22" height="14" rx="4" fill="#60a5fa"/>
      <rect x="17" y="106" width="22" height="14" rx="4" fill="#818cf8"/>
      <rect x="17" y="136" width="22" height="14" rx="4" fill="#a78bfa"/>
      <rect x="145" y="34" width="22" height="14" rx="4" fill="#38bdf8"/>
      <rect x="145" y="64" width="22" height="14" rx="4" fill="#60a5fa"/>
      <rect x="145" y="106" width="22" height="14" rx="4" fill="#818cf8"/>
      <rect x="145" y="136" width="22" height="14" rx="4" fill="#a78bfa"/>
    </g>

    <rect x="55" y="57" width="74" height="78" rx="20" fill="#102a4a" stroke="#3b82f6" stroke-width="2"/>
    <path d="M73 84V73c0-13 8-23 19-23s19 10 19 23v11"
          fill="none" stroke="url(#lock)" stroke-width="9" stroke-linecap="round"/>
    <rect x="65" y="79" width="54" height="45" rx="11" fill="url(#lock)"/>
    <circle cx="92" cy="98" r="6" fill="#2563eb"/>
    <path d="M92 103v9" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="270" y="100" fill="#f8fafc" font-size="48" font-weight="760" letter-spacing="-1.5">ThreadSafeCollections</text>
    <text x="748" y="100" fill="#67e8f9" font-size="48" font-weight="760" letter-spacing="-1.5">-FP</text>
    <text x="273" y="139" fill="#93c5fd" font-size="16" font-weight="650" letter-spacing="2.5">CONCURRENT COLLECTIONS FOR FREE PASCAL</text>

    <g transform="translate(270 169)">
      <rect width="568" height="45" rx="14" fill="#0a1b30" stroke="#294568"/>
      <circle cx="25" cy="22.5" r="5" fill="#38bdf8"/>
      <text x="40" y="28" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="1.2">LIST</text>
      <circle cx="130" cy="22.5" r="5" fill="#60a5fa"/>
      <text x="145" y="28" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="1.2">DICTIONARY</text>
      <circle cx="286" cy="22.5" r="5" fill="#818cf8"/>
      <text x="301" y="28" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="1.2">HASH SET</text>
      <circle cx="431" cy="22.5" r="5" fill="#a78bfa"/>
      <text x="446" y="28" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="1.2">DEQUE</text>
    </g>
  </g>
</svg>
